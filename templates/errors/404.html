<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada | cases.com</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/img/cases.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --brand-pink: #F9C8D3;
            --brand-blue: #A3D8DE;
            --brand-black: #1A1A1A;
            --brand-bg: #F8F9FA;
        }
        body {
            background-color: var(--brand-bg);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--brand-black);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1.5rem;
            background-image: 
                radial-gradient(at 0% 0%, rgba(249, 200, 211, 0.35) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(163, 216, 222, 0.35) 0px, transparent 50%);
        }
        .error-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.08), 0 0 1px 1px rgba(0, 0, 0, 0.03);
            max-width: 500px;
            width: 100%;
            text-align: center;
            padding: 3rem 2.25rem;
            position: relative;
            overflow: hidden;
        }
        .error-ribbon {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--brand-pink), var(--brand-blue), var(--brand-black));
        }
        .error-code {
            font-family: 'Outfit', sans-serif;
            font-size: 6.5rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2px;
            background: linear-gradient(135deg, var(--brand-black) 30%, #4B5563 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .error-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--brand-black);
        }
        .btn-brand-primary {
            background-color: var(--brand-pink);
            color: var(--brand-black);
            font-weight: 700;
            border-radius: 50px;
            padding: 0.75rem 1.75rem;
            border: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(249, 200, 211, 0.5);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-brand-primary:hover {
            background-color: #f0aebb;
            color: var(--brand-black);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(249, 200, 211, 0.7);
        }
        .btn-brand-secondary {
            background-color: #FFFFFF;
            color: var(--brand-black);
            font-weight: 600;
            border-radius: 50px;
            padding: 0.75rem 1.5rem;
            border: 1px solid #E2E8F0;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-brand-secondary:hover {
            background-color: #F8FAFC;
            border-color: #CBD5E1;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-ribbon"></div>
        <div class="mb-3">
            <img src="/static/img/cases.png" alt="cases.com" style="height: 48px; width: auto;" class="img-fluid">
        </div>
        <div class="error-code">404</div>
        <h1 class="error-title">Página No Encontrada</h1>
        <p class="text-secondary mb-4" style="font-size: 0.95rem; line-height: 1.6;">
            La ruta o recurso al que intentas acceder no existe, ha sido movido o no está disponible temporalmente.
        </p>
        <div class="d-flex flex-wrap gap-2 justify-content-center">
            <a href="/" class="btn-brand-primary">
                <i class="fa-solid fa-house"></i> Ir al Inicio
            </a>
            <button onclick="window.history.back()" class="btn-brand-secondary">
                <i class="fa-solid fa-arrow-left"></i> Volver Atrás
            </button>
        </div>
    </div>
</body>
</html>
